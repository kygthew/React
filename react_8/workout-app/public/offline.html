<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#aa3bff" />
    <title>Offline · Workout Dashboard</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <!-- Self-contained: no external CSS/JS, so it works with zero connection -->
    <style>
      :root {
        --text: #6b6375;
        --text-h: #08060d;
        --bg: #fff;
        --border: #e5e4e7;
        --accent: #aa3bff;
        --accent-bg: rgba(170, 59, 255, 0.1);
        color-scheme: light dark;
        font: 17px/1.5 system-ui, "Segoe UI", Roboto, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #9ca3af;
          --text-h: #f3f4f6;
          --bg: #16171d;
          --border: #2e303a;
          --accent: #c084fc;
          --accent-bg: rgba(192, 132, 252, 0.15);
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        text-align: center;
      }
      .card {
        width: 100%;
        max-width: 420px;
        padding: 32px 20px;
        border: 1px solid var(--border);
        border-radius: 16px;
      }
      .icon { font-size: 56px; line-height: 1; }
      h1 { color: var(--text-h); font-size: 26px; margin: 16px 0 8px; font-weight: 600; }
      p { margin: 0 0 12px; }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 8px 0 20px;
        padding: 4px 12px;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 600;
        background: #fee2e2;
        color: #991b1b;
      }
      .status.online { background: #dcfce7; color: #166534; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
      button, a.button {
        display: block;
        width: 100%;
        min-height: 48px;
        margin-top: 10px;
        border-radius: 10px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        line-height: 48px;
      }
      button { border: 0; background: var(--accent); color: #fff; }
      button:disabled { opacity: 0.6; cursor: wait; }
      a.button { border: 1px solid var(--border); color: var(--text-h); background: var(--accent-bg); }
      .hint { font-size: 14px; margin-top: 16px; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon" aria-hidden="true">📡</div>
      <h1>You're offline</h1>
      <p>This page hasn't been saved for offline use yet, so it can't open without an internet connection.</p>

      <div id="status" class="status" role="status"><span class="dot"></span><span id="status-text">Offline</span></div>

      <button id="retry">Retry connection</button>
      <a class="button" href="/">Open saved app</a>

      <p class="hint">Pages and meal ideas you opened before are still available offline.</p>
    </main>

    <script>
      const statusBox = document.getElementById("status");
      const statusText = document.getElementById("status-text");
      const retry = document.getElementById("retry");

      function showStatus(online) {
        statusBox.classList.toggle("online", online);
        statusText.textContent = online ? "Back online" : "Offline";
      }

      // Real check: try to reach the server, not just navigator.onLine
      async function isReallyOnline() {
        try {
          const res = await fetch("/manifest.json?ping=" + Date.now(), { cache: "no-store" });
          return res.ok;
        } catch {
          return false;
        }
      }

      async function tryAgain() {
        retry.disabled = true;
        retry.textContent = "Checking...";
        const online = await isReallyOnline();
        showStatus(online);
        if (online) {
          location.reload(); // reload the page the user originally wanted
          return;
        }
        retry.disabled = false;
        retry.textContent = "Retry connection";
      }

      retry.addEventListener("click", tryAgain);
      window.addEventListener("online", tryAgain); // reconnect automatically
      window.addEventListener("offline", () => showStatus(false));
      showStatus(false);
    </script>
  </body>
</html>
